<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Archive Movies - Stremio Add-on</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #161920;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2e3d;
        }
        h1 {
            color: #f43f5e;
            margin-bottom: 10px;
        }
        p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #f43f5e;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
            margin: 5px;
        }
        .btn:hover {
            background-color: #e11d48;
        }
        .btn-secondary {
            background-color: #2a2e3d;
        }
        .btn-secondary:hover {
            background-color: #374151;
        }
        .version {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Internet Archive Movies</h1>
        <p>Un add-on pour <strong>Stremio</strong> permettant de parcourir, rechercher et regarder en streaming des milliers de films classiques et du domaine public hébergés sur Internet Archive.</p>
        
        <div>
            <a href="stremio://manifest.json" class="btn">Installer dans Stremio</a>
            <a href="./manifest.json" target="_blank" class="btn btn-secondary">Voir le Manifest</a>
        </div>

        <div class="version">Version 1.2.0 • Propulsé par Vercel</div>
    </div>
</body>
</html>
